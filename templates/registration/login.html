{% extends "base.html" %}
{% block title %}Login - SpendWise{% endblock %}
{% block content %}
<div class="card narrow">
  <h2>Login</h2>
  <form method="post">
    {% csrf_token %}
    {% for field in form %}
      <div class="field">
        <label for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}
      </div>
    {% endfor %}
    {% if form.non_field_errors %}
      <p class="error">{{ form.non_field_errors.0 }}</p>
    {% endif %}
    <button type="submit" class="btn">Login</button>
  </form>
  <p class="muted">New here? <a href="{% url 'register' %}">Create an account</a></p>
</div>
{% endblock %}
