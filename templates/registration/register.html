{% extends "base.html" %}
{% block title %}Register - SpendWise{% endblock %}
{% block content %}
<div class="card narrow">
  <h2>Create account</h2>
  <form method="post">
    {% csrf_token %}
    {% for field in form %}
      <div class="field">
        <label for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}
        {% for error in field.errors %}<p class="error">{{ error }}</p>{% endfor %}
      </div>
    {% endfor %}
    <button type="submit" class="btn">Register</button>
  </form>
  <p class="muted">Already have an account? <a href="{% url 'login' %}">Login</a></p>
</div>
{% endblock %}
