{% extends "base.html" %}
{% block title %}{{ title }} - SpendWise{% endblock %}
{% block content %}
<div class="card narrow">
  <h2>{{ title }}</h2>
  <form method="post">
    {% csrf_token %}
    {% for field in form %}
      <div class="field">
        <label for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}
        {% for error in field.errors %}<p class="error">{{ error }}</p>{% endfor %}
      </div>
    {% endfor %}
    <button type="submit" class="btn">Save</button>
    <a href="{% url 'expense_list' %}" class="muted">Cancel</a>
  </form>
</div>
{% endblock %}
