{% extends "base.html" %}

{% block title %}Monthly Budget - SpendWise{% endblock %}

{% block content %}
<div class="page-head">
  <h2>Set Monthly Budget</h2>
</div>

<div class="card">
  <form method="post">
    {% csrf_token %}

    <div class="form-group">
      <label for="month">Month</label>
      <input
        type="month"
        id="month"
        name="month"
        value="{{ month_value }}"
        required
      >
    </div>

    <div class="form-group">
      <label for="amount">Budget Amount</label>
      <input
        type="number"
        id="amount"
        name="amount"
        step="0.01"
        min="0.01"
        placeholder="e.g. 5000"
        required
      >
    </div>

    <button type="submit" class="btn">Save Budget</button>
  </form>
</div>

<div style="margin-top: 20px;">
  <a href="{% url 'dashboard' %}">← Back to Dashboard</a>
</div>
{% endblock %}
