{% extends "base.html" %}
{% block title %}Delete expense - SpendWise{% endblock %}
{% block content %}
<div class="card narrow">
  <h2>Delete expense?</h2>
  <p>Are you sure you want to delete <strong>{{ expense.title }}</strong> (₹{{ expense.amount }})?</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, delete</button>
    <a href="{% url 'expense_list' %}" class="muted">Cancel</a>
  </form>
</div>
{% endblock %}
